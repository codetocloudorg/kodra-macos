name: macOS Install (Apple Silicon E2E)

# ╔══════════════════════════════════════════════════════════════════╗
# ║  Kodra macOS E2E — A Code To Cloud Project ☁️                   ║
# ║                                                                  ║
# ║  Runs on REAL Apple Silicon macOS runners (macos-15) to          ║
# ║  validate the actual user experience: fresh macOS → boot.sh →   ║
# ║  kodra install. This catches macOS-specific issues that a        ║
# ║  Linux runner would miss.                                        ║
# ║                                                                  ║
# ║  Jobs:                                                           ║
# ║    1. e2e-macos-install — Full install mimicking real user flow  ║
# ╚══════════════════════════════════════════════════════════════════╝

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      install_flags:
        description: 'Extra flags for install.sh (e.g., --debug)'
        required: false
        default: '--debug'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  KODRA_CI_BANNER: |
    echo ""
    echo "    ██╗  ██╗ ██████╗ ██████╗ ██████╗  █████╗ "
    echo "    ██║ ██╔╝██╔═══██╗██╔══██╗██╔══██╗██╔══██╗"
    echo "    █████╔╝ ██║   ██║██║  ██║██████╔╝███████║"
    echo "    ██╔═██╗ ██║   ██║██║  ██║██╔══██╗██╔══██║"
    echo "    ██║  ██╗╚██████╔╝██████╔╝██║  ██║██║  ██║"
    echo "    ╚═╝  ╚═╝ ╚═════╝ ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝"
    echo ""
    echo "    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    echo "    🍎  F R O M   C O D E   T O   C L O U D  🍎"
    echo "    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    echo ""

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 1: Real macOS Apple Silicon — the authentic user experience
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  e2e-macos-install:
    name: "🍎 macOS Install (Apple Silicon)"
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: "☁️ Code To Cloud — Environment info"
        run: |
          eval "$KODRA_CI_BANNER"
          printf "╔══════════════════════════════════════════════════╗\n"
          printf "║  %-48s║\n" "Kodra macOS E2E — Real Install Test"
          printf "║  %-48s║\n" "macOS: $(sw_vers -productVersion) ($(sw_vers -productName))"
          printf "║  %-48s║\n" "Build: $(sw_vers -buildVersion)"
          printf "║  %-48s║\n" "Arch: $(uname -m)"
          printf "║  %-48s║\n" "Chip: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'N/A')"
          printf "║  %-48s║\n" "Brew: $(brew --version | head -1)"
          printf "║  %-48s║\n" "Shell: $SHELL"
          printf "║  %-48s║\n" "User: $(whoami) | Home: $HOME"
          printf "║  %-48s║\n" "Disk: $(df -h / | awk 'NR==2 {print $4}') free"
          printf "║  %-48s║\n" "Date: $(date)"
          printf "╚══════════════════════════════════════════════════╝\n"

      # ─────────────────────────────────────────────────────────────
      # Mimic real user: copy repo to ~/.kodra (like boot.sh does)
      # ─────────────────────────────────────────────────────────────
      - name: "📦 Copy repo to ~/.kodra (mimics boot.sh clone)"
        run: |
          rm -rf ~/.kodra
          cp -r "${{ github.workspace }}" ~/.kodra
          echo "✓ Copied to ~/.kodra"
          cat ~/.kodra/VERSION

      # ─────────────────────────────────────────────────────────────
      # Ensure Homebrew is fresh and ready
      # ─────────────────────────────────────────────────────────────
      - name: "🍺 Prepare Homebrew"
        run: |
          brew update --quiet
          echo "✅ Homebrew ready: $(brew --prefix)"

      # ─────────────────────────────────────────────────────────────
      # Run the full install — exactly as a real user would
      # ─────────────────────────────────────────────────────────────
      - name: "🚀 Run full Kodra macOS install"
        id: install
        run: |
          printf "╔══════════════════════════════════════════════════╗\n"
          printf "║  %-48s║\n" "Kodra macOS E2E — Full Install"
          printf "║  %-48s║\n" "macOS: $(sw_vers -productVersion)"
          printf "║  %-48s║\n" "Arch: $(uname -m)"
          printf "║  %-48s║\n" "User: $(whoami) | Home: $HOME"
          printf "║  %-48s║\n" "Date: $(date)"
          printf "╚══════════════════════════════════════════════════╝\n"
          echo ""

          cd "$HOME/.kodra"
          echo "Version: $(cat VERSION)"
          echo ""

          echo "▶ Running install.sh --debug..."
          echo "═══════════════════════════════════════════════════════"

          export KODRA_SKIP_PROMPTS=1
          start_time=$(date +%s)
          bash ./install.sh --debug 2>&1 | tee /tmp/kodra-install.log || true
          install_exit=$?
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          echo ""
          echo "═══════════════════════════════════════════════════════"
          printf "Install completed in %ds (exit: %d)\n" "$duration" "$install_exit"

      # ─────────────────────────────────────────────────────────────
      # Verify all installed tools (mirrors WSL verification pattern)
      # ─────────────────────────────────────────────────────────────
      - name: "🔍 Verify installed tools"
        id: verify
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Tool Verification on macOS                       │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          export PATH="$HOME/.kodra/bin:$HOME/.local/bin:$(brew --prefix)/bin:$PATH"
          export KODRA_DIR="$HOME/.kodra"

          failures=0
          total=0

          # ─── Core CLI Tools ─────────────────────────────────
          EXPECTED_TOOLS=(
            "git" "curl" "jq"
            "bat" "btop" "delta" "direnv" "eza" "fzf" "rg" "zoxide" "yq"
            "fastfetch" "lazygit" "gh" "fd"
            "http" "nvim" "shellcheck" "tldr" "act"
            "copilot"
          )

          echo "Core CLI Tools:"
          for cmd in "${EXPECTED_TOOLS[@]}"; do
            total=$((total + 1))
            if command -v "$cmd" &>/dev/null; then
              ver=$("$cmd" --version 2>/dev/null | head -1 || echo "installed")
              printf "  ✅ %-15s %s\n" "$cmd" "$ver"
            else
              printf "  ❌ %-15s NOT FOUND\n" "$cmd"
              failures=$((failures + 1))
            fi
          done

          # ─── Cloud & DevOps Tools ───────────────────────────
          CLOUD_TOOLS=(
            "az" "azd" "kubectl" "helm" "terraform" "tofu" "k9s"
            "oc" "ansible"
          )

          echo ""
          echo "Cloud & DevOps Tools:"
          for cmd in "${CLOUD_TOOLS[@]}"; do
            total=$((total + 1))
            if command -v "$cmd" &>/dev/null; then
              ver=$("$cmd" --version 2>/dev/null | head -1 || echo "installed")
              printf "  ✅ %-15s %s\n" "$cmd" "$ver"
            else
              printf "  ❌ %-15s NOT FOUND\n" "$cmd"
              failures=$((failures + 1))
            fi
          done

          # ─── Container Tools ────────────────────────────────
          CONTAINER_TOOLS=(
            "colima" "docker" "lazydocker" "trivy" "dive"
          )

          echo ""
          echo "Container Tools:"
          for cmd in "${CONTAINER_TOOLS[@]}"; do
            total=$((total + 1))
            if command -v "$cmd" &>/dev/null; then
              ver=$("$cmd" --version 2>/dev/null | head -1 || echo "installed")
              printf "  ✅ %-15s %s\n" "$cmd" "$ver"
            else
              printf "  ❌ %-15s NOT FOUND\n" "$cmd"
              failures=$((failures + 1))
            fi
          done

          # ─── Terminal Tools ─────────────────────────────────
          TERMINAL_TOOLS=(
            "starship"
            "tmux"
          )

          echo ""
          echo "Terminal Tools:"
          for cmd in "${TERMINAL_TOOLS[@]}"; do
            total=$((total + 1))
            if command -v "$cmd" &>/dev/null; then
              ver=$("$cmd" --version 2>/dev/null | head -1 || echo "installed")
              printf "  ✅ %-15s %s\n" "$cmd" "$ver"
            else
              printf "  ❌ %-15s NOT FOUND\n" "$cmd"
              failures=$((failures + 1))
            fi
          done

          # ─── PowerShell (.pkg install) ──────────────────────
          echo ""
          echo "Native .pkg Tools:"
          total=$((total + 1))
          if command -v pwsh &>/dev/null; then
            ver=$(pwsh --version 2>/dev/null | head -1 || echo "installed")
            printf "  ✅ %-15s %s\n" "pwsh" "$ver"
          else
            printf "  ❌ %-15s NOT FOUND\n" "pwsh"
            failures=$((failures + 1))
          fi

          # ─── Dev Tools ──────────────────────────────────────
          echo ""
          echo "Dev Tools:"
          total=$((total + 1))
          if command -v mise &>/dev/null; then
            ver=$(mise --version 2>/dev/null | head -1 || echo "installed")
            printf "  ✅ %-15s %s\n" "mise" "$ver"
          else
            printf "  ❌ %-15s NOT FOUND\n" "mise"
            failures=$((failures + 1))
          fi

          echo ""
          echo "Results: $((total - failures))/$total passed | $failures failed"

          echo "tool_failures=$failures" >> "$GITHUB_OUTPUT"
          echo "tool_total=$total" >> "$GITHUB_OUTPUT"

          if [ "$failures" -gt 5 ]; then
            echo "::error::Too many tool verification failures ($failures/$total)"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # Test kodra CLI commands (mirrors WSL CLI test)
      # ─────────────────────────────────────────────────────────────
      - name: "🩺 Test kodra CLI commands"
        if: always()
        run: |
          set +e
          export PATH="$HOME/.kodra/bin:$HOME/.local/bin:$(brew --prefix)/bin:$PATH"
          export KODRA_DIR="$HOME/.kodra"

          echo "▶ kodra version"
          kodra version || true
          echo ""

          echo "▶ kodra help"
          kodra help || true
          echo ""

          echo "▶ kodra doctor"
          kodra doctor || true
          echo ""

          echo "▶ kodra shortcuts"
          kodra shortcuts || true
          echo ""

          echo "▶ kodra fetch"
          kodra fetch || true
          echo ""

          echo "✅ CLI commands completed"

      # ─────────────────────────────────────────────────────────────
      # Verify shell config was applied
      # ─────────────────────────────────────────────────────────────
      - name: "🐚 Verify shell configuration"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Shell Configuration Verification                 │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          failures=0

          # Check Kodra shell config was created
          if [ -f "$HOME/.config/kodra/shell.zsh" ]; then
            echo "  ✅ Kodra shell config exists"
          else
            echo "  ❌ Missing: ~/.config/kodra/shell.zsh"
            failures=$((failures + 1))
          fi

          # Check .zshrc sources Kodra config
          if [ -f "$HOME/.zshrc" ] && grep -q "kodra" "$HOME/.zshrc" 2>/dev/null; then
            echo "  ✅ .zshrc sources Kodra config"
          else
            echo "  ⚠️  .zshrc does not source Kodra (may be first install)"
          fi

          # Check Kodra state file was written
          if [ -f "$HOME/.local/state/kodra/state.json" ]; then
            echo "  ✅ State file exists"
            echo "     $(cat "$HOME/.local/state/kodra/state.json" | head -5)"
          else
            echo "  ❌ Missing: state.json"
            failures=$((failures + 1))
          fi

          # Check bin/kodra is symlinked
          if [ -L "$HOME/.local/bin/kodra" ] || [ -f "$HOME/.local/bin/kodra" ]; then
            echo "  ✅ kodra CLI linked to ~/.local/bin"
          else
            echo "  ❌ kodra CLI not in ~/.local/bin"
            failures=$((failures + 1))
          fi

          # Check bat config
          if [ -f "$HOME/.config/bat/config" ]; then
            echo "  ✅ bat config exists"
          else
            echo "  ⚠️  bat config not found"
          fi

          # Check starship config
          if [ -f "$HOME/.config/starship.toml" ]; then
            echo "  ✅ starship.toml exists"
          else
            echo "  ⚠️  starship.toml not found"
          fi

          # Check fastfetch config
          if [ -f "$HOME/.config/fastfetch/config.jsonc" ]; then
            echo "  ✅ fastfetch config exists"
          else
            echo "  ⚠️  fastfetch config not found"
          fi

          # Check Ghostty config
          if [ -f "$HOME/.config/ghostty/config" ]; then
            echo "  ✅ ghostty config exists"
            if grep -q "Cyberpunk" "$HOME/.config/ghostty/config" 2>/dev/null; then
              echo "  ✅ ghostty Cyberpunk theme configured"
            else
              echo "  ⚠️  ghostty Cyberpunk theme not set"
            fi
            if grep -q "quick-terminal-position" "$HOME/.config/ghostty/config" 2>/dev/null; then
              echo "  ✅ ghostty quick terminal configured"
            else
              echo "  ⚠️  ghostty quick terminal not configured"
            fi
          else
            echo "  ⚠️  ghostty config not found"
          fi

          # Check tmux config
          if [ -f "$HOME/.tmux.conf" ]; then
            echo "  ✅ tmux.conf exists"
            if grep -q "prefix C-a" "$HOME/.tmux.conf" 2>/dev/null; then
              echo "  ✅ tmux Ctrl+a prefix configured"
            else
              echo "  ⚠️  tmux prefix not configured"
            fi
          else
            echo "  ⚠️  tmux.conf not found"
          fi

          # Check sidebar menu
          if [ -f "$HOME/.config/ghostty/sidebar-menu.sh" ]; then
            echo "  ✅ sidebar-menu.sh deployed"
          else
            echo "  ⚠️  sidebar-menu.sh not found"
          fi

          echo ""
          if [ "$failures" -eq 0 ]; then
            echo "  ✅ Shell configuration verified"
          else
            echo "  ⚠️  $failures config issue(s)"
          fi

      # ─────────────────────────────────────────────────────────────
      # Verify Colima / Docker setup (don't start VM in CI)
      # ─────────────────────────────────────────────────────────────
      - name: "🐳 Verify container setup"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Container Setup Verification                     │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          if command -v colima &>/dev/null; then
            echo "  ✅ colima installed: $(colima version 2>/dev/null | head -1)"
          else
            echo "  ❌ colima not found"
          fi

          if command -v docker &>/dev/null; then
            echo "  ✅ docker CLI installed: $(docker --version 2>/dev/null)"
          else
            echo "  ❌ docker CLI not found"
          fi

          if [ -f "$HOME/Library/LaunchAgents/com.kodra.colima.plist" ]; then
            echo "  ✅ Colima launchd plist installed (auto-start on login)"
          else
            echo "  ⚠️  Colima launchd plist not found"
          fi

          if [ -d "$HOME/.docker/cli-plugins" ]; then
            echo "  ✅ Docker CLI plugins directory exists"
            ls -la "$HOME/.docker/cli-plugins/" 2>/dev/null | grep -v "^total"
          fi

          echo ""
          echo "  ℹ️  Skipping colima start — no nested VMs in CI"

      # ─────────────────────────────────────────────────────────────
      # Verify Copilot CLI (cask + gh extension)
      # ─────────────────────────────────────────────────────────────
      - name: "🤖 Verify Copilot CLI"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Copilot CLI Verification                         │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          export PATH="$HOME/.kodra/bin:$HOME/.local/bin:$(brew --prefix)/bin:$PATH"

          # Check standalone Copilot CLI (cask)
          if command -v copilot &>/dev/null; then
            echo "  ✅ copilot CLI installed: $(copilot --version 2>/dev/null | head -1 || echo 'ok')"
          else
            echo "  ❌ copilot CLI not found (brew install --cask copilot-cli)"
          fi

          # Check gh-copilot extension
          if gh extension list 2>/dev/null | grep -q "copilot"; then
            echo "  ✅ gh-copilot extension installed"
          else
            echo "  ⚠️  gh-copilot extension not found (may need auth)"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify container runtime selection & Docker CLI always present
      # ─────────────────────────────────────────────────────────────
      - name: "🔀 Verify container runtime selection"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Container Runtime Selection Verification          │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          export PATH="$HOME/.kodra/bin:$HOME/.local/bin:$(brew --prefix)/bin:$PATH"

          # Docker CLI must always be present regardless of runtime
          if command -v docker &>/dev/null; then
            echo "  ✅ Docker CLI always installed ($(docker --version 2>/dev/null | head -1))"
          else
            echo "  ❌ Docker CLI missing — should always be installed"
          fi

          # Verify install.sh supports KODRA_CONTAINER_RUNTIME override
          if grep -q "KODRA_CONTAINER_RUNTIME" "$HOME/.kodra/install.sh" 2>/dev/null; then
            echo "  ✅ KODRA_CONTAINER_RUNTIME env override supported"
          else
            echo "  ❌ KODRA_CONTAINER_RUNTIME env override missing"
          fi

          # Verify install.sh supports KODRA_SKIP_PROMPTS for CI
          if grep -q "KODRA_SKIP_PROMPTS" "$HOME/.kodra/install.sh" 2>/dev/null; then
            echo "  ✅ KODRA_SKIP_PROMPTS supported for CI"
          else
            echo "  ❌ KODRA_SKIP_PROMPTS missing"
          fi

          # Verify /dev/tty prompt support (for curl | bash)
          if grep -q "< /dev/tty" "$HOME/.kodra/install.sh" 2>/dev/null; then
            echo "  ✅ Interactive prompts use /dev/tty (curl | bash compatible)"
          else
            echo "  ❌ Missing /dev/tty redirect for prompts"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify install menu structure (6 options including uninstall/exit)
      # ─────────────────────────────────────────────────────────────
      - name: "📋 Verify install menu structure"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Install Menu Structure Verification              │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          INSTALL_SH="$HOME/.kodra/install.sh"

          check_menu() {
            local what="$1"
            local pattern="$2"
            if grep -q "$pattern" "$INSTALL_SH" 2>/dev/null; then
              printf "  ✅ %-40s present\n" "$what"
            else
              printf "  ❌ %-40s MISSING\n" "$what"
            fi
          }

          echo "  Install profile options:"
          check_menu "Option 1: Full Install"         "Full Install"
          check_menu "Option 2: Minimal"              "Minimal"
          check_menu "Option 3: Developer"            "Developer"
          check_menu "Option 4: Cloud Engineer"       "Cloud Engineer"
          check_menu "Option 5: Uninstall Kodra"      "Uninstall Kodra"
          check_menu "Option 6: Exit"                 "Exit"

          echo ""
          echo "  Menu mechanics:"
          check_menu "Prompt shows [1-6]"             "1-6"
          check_menu "Reads from /dev/tty"            "< /dev/tty"
          check_menu "Uninstall exec's script"        "exec bash.*uninstall"
          check_menu "Exit calls exit 0"              "exit 0"

          echo ""
          echo "  Container runtime submenu:"
          check_menu "Docker option"                  "Docker (Colima"
          check_menu "Podman option"                  "Podman (Podman"
          check_menu "Prompt shows [1-2]"             "1-2"

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify Podman installer structure (without running it)
      # ─────────────────────────────────────────────────────────────
      - name: "🦭 Verify Podman installer structure"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Podman Installer Structural Verification          │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          PODMAN_SH="$HOME/.kodra/install/containers/podman.sh"

          if [ -f "$PODMAN_SH" ]; then
            echo "  ✅ podman.sh exists"
          else
            echo "  ❌ podman.sh missing"
            exit 0
          fi

          # Valid bash syntax
          if bash -n "$PODMAN_SH" 2>/dev/null; then
            echo "  ✅ podman.sh syntax valid"
          else
            echo "  ❌ podman.sh has syntax errors"
          fi

          # Apple Hypervisor machine init
          if grep -q "podman machine init" "$PODMAN_SH"; then
            echo "  ✅ Podman machine init configured"
          else
            echo "  ❌ Podman machine init missing"
          fi

          # DOCKER_HOST environment config
          if grep -q "DOCKER_HOST" "$PODMAN_SH"; then
            echo "  ✅ DOCKER_HOST configured for Podman socket"
          else
            echo "  ❌ DOCKER_HOST not configured"
          fi

          # VS Code integration
          if grep -q "dev.containers.dockerPath" "$PODMAN_SH"; then
            echo "  ✅ VS Code Dev Containers configured for Podman"
          else
            echo "  ❌ VS Code Dev Containers not configured"
          fi

          # Testcontainers support
          if grep -q "TESTCONTAINERS" "$PODMAN_SH"; then
            echo "  ✅ Testcontainers environment configured"
          else
            echo "  ❌ Testcontainers environment missing"
          fi

          # podman-env.zsh created
          if grep -q "podman-env.zsh" "$PODMAN_SH"; then
            echo "  ✅ podman-env.zsh shell config generated"
          else
            echo "  ❌ podman-env.zsh not generated"
          fi

          # launchd plist for auto-start
          if grep -q "com.kodra.podman" "$PODMAN_SH"; then
            echo "  ✅ launchd plist for auto-start included"
          else
            echo "  ❌ launchd plist missing"
          fi

          # podman-compose installed
          if grep -q "podman-compose" "$PODMAN_SH"; then
            echo "  ✅ podman-compose included"
          else
            echo "  ❌ podman-compose missing"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify boot.sh TTY handling
      # ─────────────────────────────────────────────────────────────
      - name: "📟 Verify boot.sh TTY handling"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  boot.sh TTY Handling Verification                 │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          BOOT_SH="$HOME/.kodra/boot.sh"

          if [ -f "$BOOT_SH" ]; then
            echo "  ✅ boot.sh exists"
          else
            echo "  ❌ boot.sh missing"
            exit 0
          fi

          # Valid bash syntax
          if bash -n "$BOOT_SH" 2>/dev/null; then
            echo "  ✅ boot.sh syntax valid"
          else
            echo "  ❌ boot.sh has syntax errors"
          fi

          # /dev/tty redirect for Homebrew install
          if grep -q "/dev/tty" "$BOOT_SH"; then
            echo "  ✅ /dev/tty redirect for Homebrew (curl | bash support)"
          else
            echo "  ❌ Missing /dev/tty redirect — Homebrew will fail via pipe"
          fi

          # Fallback message for non-interactive
          if grep -q "interactive terminal" "$BOOT_SH"; then
            echo "  ✅ Fallback message when /dev/tty unavailable"
          else
            echo "  ❌ Missing fallback message"
          fi

          # Skips Homebrew if already installed
          if grep -q "command -v brew" "$BOOT_SH"; then
            echo "  ✅ Skips Homebrew install if already present"
          else
            echo "  ❌ Missing Homebrew presence check"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify shell config container awareness
      # ─────────────────────────────────────────────────────────────
      - name: "🔗 Verify shell config container awareness"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Shell Config Container Awareness                  │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          SHELL_CFG="$HOME/.kodra/install/terminal/shell-config.sh"

          # Shell config sources podman-env.zsh when present
          if grep -q "podman-env.zsh" "$SHELL_CFG" 2>/dev/null; then
            echo "  ✅ shell-config.sh sources podman-env.zsh when present"
          else
            echo "  ❌ shell-config.sh does not source podman-env.zsh"
          fi

          # Verify generated shell.zsh exists (created during install)
          if [ -f "$HOME/.config/kodra/shell.zsh" ]; then
            echo "  ✅ shell.zsh generated during install"

            # Check it contains podman-env sourcing logic
            if grep -q "podman-env" "$HOME/.config/kodra/shell.zsh" 2>/dev/null; then
              echo "  ✅ shell.zsh includes podman-env conditional sourcing"
            else
              echo "  ⚠️  shell.zsh does not include podman-env (Docker runtime selected)"
            fi
          else
            echo "  ❌ shell.zsh not found"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify macOS desktop defaults were applied
      # ─────────────────────────────────────────────────────────────
      - name: "🖥️ Verify macOS defaults"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  macOS Defaults Verification                      │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          check_default() {
            local domain="$1"
            local key="$2"
            local expected="$3"
            local label="$4"

            actual=$(defaults read "$domain" "$key" 2>/dev/null)
            if [ "$actual" = "$expected" ]; then
              echo "  ✅ $label ($actual)"
            else
              echo "  ⚠️  $label (expected: $expected, got: ${actual:-unset})"
            fi
          }

          check_default "com.apple.finder" "AppleShowAllFiles" "1" "Finder: show hidden files"
          check_default "com.apple.finder" "ShowPathbar" "1" "Finder: show path bar"
          check_default "com.apple.finder" "ShowStatusBar" "1" "Finder: show status bar"
          check_default "com.apple.finder" "FXPreferredViewStyle" "Nlsv" "Finder: list view"
          check_default "NSGlobalDomain" "AppleShowAllExtensions" "1" "Show file extensions"
          check_default "NSGlobalDomain" "KeyRepeat" "2" "Fast key repeat"
          check_default "NSGlobalDomain" "InitialKeyRepeat" "15" "Fast initial key repeat"
          check_default "NSGlobalDomain" "NSAutomaticSpellingCorrectionEnabled" "0" "Autocorrect disabled"
          check_default "com.apple.dock" "autohide" "1" "Dock: auto-hide"
          check_default "com.apple.dock" "show-recents" "0" "Dock: no recents"
          check_default "com.apple.dock" "tilesize" "48" "Dock: tile size"
          check_default "com.apple.screencapture" "location" "$HOME/Screenshots" "Screenshots: ~/Screenshots"
          check_default "com.apple.screencapture" "type" "png" "Screenshots: PNG format"
          check_default "com.apple.dock" "mru-spaces" "0" "No auto-rearrange spaces"

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Test uninstall script (dry-run validation)
      # ─────────────────────────────────────────────────────────────
      - name: "🗑️ Verify uninstall script"
        if: always()
        run: |
          set +e
          echo "┌──────────────────────────────────────────────────┐"
          echo "│  Uninstall Script Verification                    │"
          echo "└──────────────────────────────────────────────────┘"
          echo ""

          UNINSTALL_SH="$HOME/.kodra/uninstall.sh"

          echo "  Validating syntax..."
          bash -n "$UNINSTALL_SH"
          echo "  ✅ uninstall.sh has valid syntax"

          # Verify it covers all installed tools
          echo ""
          echo "  Checking uninstall coverage:"

          check_uninstall() {
            local what="$1"
            local pattern="$2"
            if grep -q "$pattern" "$UNINSTALL_SH" 2>/dev/null; then
              printf "  ✅ %-35s covered\n" "$what"
            else
              printf "  ❌ %-35s NOT covered\n" "$what"
            fi
          }

          check_uninstall "Homebrew formulae"          "KODRA_BREW_FORMULAE"
          check_uninstall "Homebrew casks"              "KODRA_BREW_CASKS"
          check_uninstall "PowerShell .pkg"             "powershell"
          check_uninstall "PowerShell.app"              "PowerShell.app"
          check_uninstall "gh-copilot extension"        "gh extension remove"
          check_uninstall "Colima stop"                 "colima stop"
          check_uninstall "Podman machine stop"         "podman machine stop"
          check_uninstall "Colima launchd plist"        "com.kodra.colima"
          check_uninstall "Podman launchd plist"        "com.kodra.podman"
          check_uninstall "VS Code settings cleanup"    "dev.containers.dockerPath"
          check_uninstall "Shell config cleanup"        "zshrc"
          check_uninstall "Starship config"             "starship.toml"
          check_uninstall "bat config"                  "bat/config"
          check_uninstall "ghostty config"              "ghostty/config"
          check_uninstall "sidebar-menu.sh"              "sidebar-menu.sh"
          check_uninstall "tmux.conf"                    "tmux.conf"
          check_uninstall "Podman data dir"             ".local/share/containers"
          check_uninstall "Colima data dir"             ".colima"
          check_uninstall "Docker config dir"           ".docker"
          check_uninstall "Confirmation prompt"         "read -rp"
          check_uninstall "TTY redirect"                "/dev/tty"
          check_uninstall "Brew cleanup"                "brew cleanup"
          check_uninstall "Brew autoremove"             "brew autoremove"
          check_uninstall "--ignore-dependencies"       "ignore-dependencies"
          check_uninstall "--force flag"                 "--force"
          check_uninstall "/Applications fallback"      "/Applications/"
          check_uninstall "VS Code.app fallback"        "Visual Studio Code"
          check_uninstall "CLI symlink removal"         "local/bin/kodra"
          check_uninstall "podman-env.zsh cleanup"      "podman-env.zsh"

          echo ""
          echo "  Formula/cask parity check:"

          # Verify every expected formula is in the uninstall script
          MISSING=0
          for f in bat btop eza fzf ripgrep zoxide yq jq fd fastfetch lazygit gh git-delta direnv httpie neovim shellcheck tldr act starship mise tmux azure-cli azd opentofu kubectl helm k9s colima docker docker-compose lazydocker podman podman-compose; do
            if ! grep -q "$f" "$UNINSTALL_SH" 2>/dev/null; then
              echo "  ❌ Formula '$f' missing from uninstall"
              MISSING=1
            fi
          done
          for c in ghostty copilot-cli visual-studio-code podman-desktop font-jetbrains-mono-nerd-font font-meslo-lg-nerd-font; do
            if ! grep -q "$c" "$UNINSTALL_SH" 2>/dev/null; then
              echo "  ❌ Cask '$c' missing from uninstall"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "  ✅ All formulae and casks covered in uninstall"
          fi

          echo ""

      # ─────────────────────────────────────────────────────────────
      # Verify HTTPS site is live
      # ─────────────────────────────────────────────────────────────
      - name: "🌐 Verify HTTPS site (kodra.macos.codetocloud.io)"
        if: always()
        run: |
          echo "Testing HTTPS endpoints..."
          curl -fsSL https://kodra.macos.codetocloud.io/boot.sh | head -3
          echo ""
          curl -fsSL https://kodra.macos.codetocloud.io/llms.txt | head -3
          echo ""
          echo "✅ HTTPS site serving correctly"

      # ─────────────────────────────────────────────────────────────
      # Upload install logs
      # ─────────────────────────────────────────────────────────────
      - name: "📦 Upload install logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodra-macos-install-log
          path: /tmp/kodra-install.log
          retention-days: 14

      # ─────────────────────────────────────────────────────────────
      # Final summary
      # ─────────────────────────────────────────────────────────────
      - name: "📊 Job summary"
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🍎 E2E macOS Install (Apple Silicon)

          **Environment:** macOS 15 (Sequoia) on Apple Silicon
          **Installer flags:** `--debug`

          | Category | Result |
          |----------|--------|
          | Tool Verification | ${{ steps.verify.outputs.tool_failures || '?' }} failures / ${{ steps.verify.outputs.tool_total || '?' }} total |
          | Kodra CLI | ✅ Tested |
          | Shell Config | ✅ Verified |
          | Container Setup | ✅ Verified (no VM start) |
          | macOS Defaults | ✅ Verified |
          EOF
