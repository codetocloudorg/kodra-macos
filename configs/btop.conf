# Kodra macOS — btop configuration
# Tokyo Night color scheme

#* Color theme
color_theme = "tokyo-night"

#* Update time in milliseconds
update_ms = 1500

#* Show CPU graph
shown_boxes = "cpu mem net proc"

#* Process sorting
proc_sorting = "cpu lazy"

#* Show detailed CPU info
cpu_single_graph = false

#* Show temperatures
show_disks = true
